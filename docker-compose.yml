services:
  mongodb:
    image: mongo:7.0
    container_name: society_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: societyDB
    volumes:
      - mongo_data:/data/db
    networks:
      - society_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: society_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/societyDB
      JWT_SECRET: ${JWT_SECRET:-secretkey}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_YOUR_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-YOUR_KEY_SECRET}
      RAZORPAY_WEB_SECRET: ${RAZORPAY_WEB_SECRET:-YOUR_WEB_SECRET}
      VPA_ID: ${VPA_ID:-9898216064@axl}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - society_network

  frontend:
    container_name: society_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - society_network

networks:
  society_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local

