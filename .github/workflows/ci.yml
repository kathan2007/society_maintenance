name: CI & Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Type-check + Build + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install --legacy-peer-deps

      - name: TypeScript type-check
        run: npm run type-check

      - name: Build (Vite)
        run: npm run build:ci
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:5000' }}

      - name: Unit & Component tests (Vitest)
        run: npm test

  backend:
    name: Backend — Syntax Check + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Backend Security Tests (Jest)
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: "test_secret_key_minimum_64_bytes_length_for_hmac_sha256_security_gate_testing"
          JWT_REFRESH_SECRET: "test_refresh_secret_key_minimum_64_bytes_length_for_hmac_sha256_testing"

  security-scan:
    name: Security Scans — Secret & Container Audits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build backend Docker image
        run: docker build -t society-backend:ci ./backend

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: society-backend:ci
          format: table
          exit-code: "0" # Audit report
          severity: "CRITICAL,HIGH"
