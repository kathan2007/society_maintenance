name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — TypeScript + Lint + Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint || true   # warn-only until all pages are TS-strict

      - name: Build (Vite)
        run: npm run build:ci
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:5000' }}

      - name: Test (Vitest)
        run: npm test

  backend:
    name: Backend — Syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: node --check server.js

  docker-build:
    name: Docker — Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t society-backend:ci ./backend

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: society-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
