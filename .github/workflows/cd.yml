name: CD Pipeline - Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract image metadata
      - name: Downcase Repository Name for Image Tagging
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Backend Build and Push
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}

      # Frontend Build and Push
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy Announcement
        run: |
          echo "✅ New Docker images successfully pushed to ghcr.io/${{ env.REPO_LOWER }}:"
          echo " - Backend: ghcr.io/${{ env.REPO_LOWER }}/backend:latest"
          echo " - Frontend: ghcr.io/${{ env.REPO_LOWER }}/frontend:latest"
          echo "Deploying to production server..."

      # Optional SSH deployment step (triggers when secrets are configured in GitHub repo)
      - name: Remote Server Deployment via SSH (Optional)
        if: "${{ env.SSH_HOST != '' }}"
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "Deploying to $SSH_HOST using docker compose pull && docker compose up -d"
          # Example SSH deployment:
          # ssh -i $SSH_KEY $SSH_USER@$SSH_HOST "cd /opt/society_maintenance && docker compose pull && docker compose up -d --remove-orphans"

